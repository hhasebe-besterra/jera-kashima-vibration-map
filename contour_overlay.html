<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERA鹿島 RCCM コンター図オーバーレイ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }
        #map {
            width: 100%;
            height: 100vh;
        }

        /* コントロールパネル */
        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 16px;
            z-index: 1000;
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-panel h2 {
            font-size: 15px;
            color: #e94560;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 14px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #94d2bd;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-row input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }
        .control-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffa502;
            min-width: 50px;
            text-align: right;
        }

        .toggle-btn {
            width: 100%;
            padding: 10px;
            border: 2px solid #e94560;
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .toggle-btn.active {
            background: #e94560;
            color: #fff;
        }
        .toggle-btn:hover {
            opacity: 0.8;
        }

        .back-link {
            display: block;
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-link:hover {
            transform: translateY(-2px);
        }

        /* 凡例 */
        .color-legend {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        .color-legend h4 {
            font-size: 12px;
            color: #ffa502;
            margin-bottom: 8px;
        }
        .color-bar {
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(to right,
                #0000ff, #0040ff, #0080ff, #00bfff, #00ffff,
                #00ff80, #00ff00, #80ff00, #ffff00,
                #ffbf00, #ff8000, #ff4000, #ff0000);
            margin-bottom: 4px;
        }
        .color-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
        }

        .note {
            font-size: 10px;
            color: #888;
            margin-top: 8px;
            line-height: 1.5;
        }

        /* サイズ調整グリッド */
        .size-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .size-grid .control-group {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="control-panel">
        <h2>RCCM コンター図オーバーレイ</h2>
        <p style="font-size:11px; color:#aaa; margin-bottom:12px;">Resultant Acceleration 分布をマップに重畳表示</p>

        <div class="control-group">
            <button class="toggle-btn active" id="contourToggle" onclick="toggleContour()">
                コンター図: 表示中
            </button>
        </div>

        <div class="control-group">
            <label>透過度</label>
            <div class="control-row">
                <input type="range" id="opacitySlider" min="0" max="100" value="60" oninput="updateOpacity()">
                <div class="control-value" id="opacityValue">60%</div>
            </div>
        </div>

        <div class="control-group">
            <label>回転角度（煙突方向）</label>
            <div class="control-row">
                <input type="range" id="rotationSlider" min="0" max="360" value="153" oninput="updateOverlay()">
                <div class="control-value" id="rotationValue">153°</div>
            </div>
        </div>

        <div class="control-group">
            <label>画像サイズ（スケール）</label>
            <div class="control-row">
                <input type="range" id="scaleSlider" min="50" max="200" value="100" oninput="updateOverlay()">
                <div class="control-value" id="scaleValue">100%</div>
            </div>
        </div>

        <div class="size-grid">
            <div class="control-group">
                <label>X方向オフセット [m]</label>
                <div class="control-row">
                    <input type="range" id="offsetXSlider" min="-200" max="200" value="0" oninput="updateOverlay()">
                    <div class="control-value" id="offsetXValue">0m</div>
                </div>
            </div>
            <div class="control-group">
                <label>Y方向オフセット [m]</label>
                <div class="control-row">
                    <input type="range" id="offsetYSlider" min="-200" max="200" value="0" oninput="updateOverlay()">
                    <div class="control-value" id="offsetYValue">0m</div>
                </div>
            </div>
        </div>

        <div class="color-legend">
            <h4>Resultant Acceleration [m/s²]</h4>
            <div class="color-bar"></div>
            <div class="color-labels">
                <span>0</span>
                <span>1e+3</span>
                <span>3e+3</span>
                <span>5e+3</span>
                <span>7e+3</span>
                <span>1e+4</span>
            </div>
        </div>

        <div class="note">
            ※ スライダーでコンター図の位置・サイズ・角度を微調整できます<br>
            ※ コンター図はRCCM解析のResultant Acceleration分布です<br>
            ※ 煙突長さ230mを基準にスケーリングしています
        </div>

        <a href="index.html" class="back-link">← 振動解析比較マップに戻る</a>
    </div>

    <script>
        // ========== 設定 ==========
        const centerLat = 35.917924;
        const centerLng = 140.698911;

        // コンター画像の元サイズ（推定: 煙突230mをベースにスケーリング）
        // 画像内の煙突が約40%の幅を占めるため、全体幅 ≈ 575m, 高さ ≈ 400m
        const baseWidthM = 575;   // 画像の幅 [m]
        const baseHeightM = 400;  // 画像の高さ [m]
        // 煙突基部は画像左端から約25%の位置
        const chimneyCenterRatioX = 0.25;
        const chimneyCenterRatioY = 0.50;

        // ========== マップ初期化 ==========
        const map = L.map('map', {
            center: [centerLat, centerLng],
            zoom: 16,
            zoomControl: true
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        });
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        });
        satelliteLayer.addTo(map);
        L.control.layers({ "航空写真": satelliteLayer, "地図": osmLayer }).addTo(map);

        // ========== 座標計算 ==========
        function offsetLatLng(lat, lng, distanceMeters, bearingDegrees) {
            const R = 6371000;
            const bearing = bearingDegrees * Math.PI / 180;
            const lat1 = lat * Math.PI / 180;
            const lng1 = lng * Math.PI / 180;

            const lat2 = Math.asin(
                Math.sin(lat1) * Math.cos(distanceMeters / R) +
                Math.cos(lat1) * Math.sin(distanceMeters / R) * Math.cos(bearing)
            );
            const lng2 = lng1 + Math.atan2(
                Math.sin(bearing) * Math.sin(distanceMeters / R) * Math.cos(lat1),
                Math.cos(distanceMeters / R) - Math.sin(lat1) * Math.sin(lat2)
            );

            return [lat2 * 180 / Math.PI, lng2 * 180 / Math.PI];
        }

        // ========== 煙突マーカー ==========
        const centerIcon = L.divIcon({
            className: '',
            html: '<div style="background:#e94560;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 15px rgba(233,69,96,0.8);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        L.marker([centerLat, centerLng], { icon: centerIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup('<b>煙突位置（中心）</b>');

        // ========== コンターオーバーレイ ==========
        let contourOverlay = null;
        let contourVisible = true;

        function updateOverlay() {
            const rotation = parseInt(document.getElementById('rotationSlider').value);
            const scale = parseInt(document.getElementById('scaleSlider').value) / 100;
            const offsetX = parseInt(document.getElementById('offsetXSlider').value);
            const offsetY = parseInt(document.getElementById('offsetYSlider').value);

            document.getElementById('rotationValue').textContent = rotation + '\u00B0';
            document.getElementById('scaleValue').textContent = Math.round(scale * 100) + '%';
            document.getElementById('offsetXValue').textContent = offsetX + 'm';
            document.getElementById('offsetYValue').textContent = offsetY + 'm';

            // 画像の実寸（スケール適用）
            const widthM = baseWidthM * scale;
            const heightM = baseHeightM * scale;

            // 煙突の転倒方向 = rotation + 180°
            const fallDirection = rotation + 180;

            // 画像の中心を基準に煙突基部からのオフセットを計算
            // 画像内で煙突基部はleft 25%, center verticallyにある
            // → 画像中心から見て、煙突基部は左に (0.5-0.25)*width = 0.25*width の位置
            // → 画像中心は煙突基部から右に 0.25*widthM の位置（= 転倒方向に移動）
            const imageCenterDist = (0.5 - chimneyCenterRatioX) * widthM;

            // 画像中心の地理座標（煙突基部から転倒方向にimageCenterDist移動、+オフセット）
            let imgCenter = offsetLatLng(centerLat, centerLng, imageCenterDist, fallDirection);
            // X/Yオフセット適用（Xは転倒方向、Yは直角方向）
            if (offsetX !== 0) {
                imgCenter = offsetLatLng(imgCenter[0], imgCenter[1], offsetX, fallDirection);
            }
            if (offsetY !== 0) {
                imgCenter = offsetLatLng(imgCenter[0], imgCenter[1], offsetY, fallDirection + 90);
            }

            // バウンディングボックス（回転前の矩形）
            const halfW = widthM / 2;
            const halfH = heightM / 2;

            // 画像のboundsを計算（非回転 - 南北方向に配置してCSSで回転）
            const south = imgCenter[0] - (halfH / 111320);
            const north = imgCenter[0] + (halfH / 111320);
            const west = imgCenter[1] - (halfW / (111320 * Math.cos(imgCenter[0] * Math.PI / 180)));
            const east = imgCenter[1] + (halfW / (111320 * Math.cos(imgCenter[0] * Math.PI / 180)));

            const bounds = [[south, west], [north, east]];

            // 既存のオーバーレイを削除
            if (contourOverlay) {
                map.removeLayer(contourOverlay);
            }

            // 新しいオーバーレイを作成
            contourOverlay = L.imageOverlay('contour_rev002.png', bounds, {
                opacity: parseInt(document.getElementById('opacitySlider').value) / 100,
                interactive: false
            }).addTo(map);

            // CSS回転を適用
            // 画像の「右」方向が転倒方向に一致するように回転
            // CSSのrotateは時計回り、地図の北が上
            // 画像内の煙突は右向き（=東=90°）なので、 fallDirection - 90° 回転する
            const cssRotation = fallDirection - 90;

            const imgElement = contourOverlay.getElement();
            if (imgElement) {
                imgElement.style.transformOrigin = 'center center';
                imgElement.style.transform = `rotate(${cssRotation}deg)`;
            }

            if (!contourVisible) {
                contourOverlay.setOpacity(0);
            }

            // 煙突転倒線を描画
            updateChimneyLine(rotation);
        }

        function updateOpacity() {
            const opacity = parseInt(document.getElementById('opacitySlider').value);
            document.getElementById('opacityValue').textContent = opacity + '%';
            if (contourOverlay && contourVisible) {
                contourOverlay.setOpacity(opacity / 100);
            }
        }

        function toggleContour() {
            contourVisible = !contourVisible;
            const btn = document.getElementById('contourToggle');
            btn.classList.toggle('active', contourVisible);
            btn.textContent = contourVisible ? 'コンター図: 表示中' : 'コンター図: 非表示';

            if (contourOverlay) {
                if (contourVisible) {
                    contourOverlay.setOpacity(parseInt(document.getElementById('opacitySlider').value) / 100);
                } else {
                    contourOverlay.setOpacity(0);
                }
            }
        }

        // ========== 煙突転倒線 ==========
        const chimneyLayer = L.layerGroup().addTo(map);

        function updateChimneyLine(rotation) {
            chimneyLayer.clearLayers();
            const fallDirection = rotation + 180;
            const tipPos = offsetLatLng(centerLat, centerLng, 230, fallDirection);

            L.polyline([[centerLat, centerLng], tipPos], {
                color: '#ff9500',
                weight: 8,
                opacity: 0.8,
                lineCap: 'round'
            }).addTo(chimneyLayer);

            const labelPos = offsetLatLng(centerLat, centerLng, 115, fallDirection);
            L.marker(labelPos, {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="background:rgba(255,149,0,0.9);border:2px solid #cc7000;border-radius:6px;padding:4px 10px;color:#000;font-size:11px;font-weight:bold;white-space:nowrap;">煙突転倒方向(230m)</div>',
                    iconSize: [130, 24],
                    iconAnchor: [65, 12]
                })
            }).addTo(chimneyLayer);

            // 同心円（距離参考）
            const distances = [50, 100, 200, 300, 400];
            const colors = ['#ff6b6b88', '#ffa50288', '#94d2bd88', '#4a90e288', '#9b59b688'];
            distances.forEach((dist, i) => {
                const circlePoints = [];
                for (let angle = 0; angle <= 360; angle += 3) {
                    circlePoints.push(offsetLatLng(centerLat, centerLng, dist, angle));
                }
                L.polyline(circlePoints, {
                    color: colors[i],
                    weight: 2,
                    opacity: 0.5,
                    dashArray: '8, 6'
                }).addTo(chimneyLayer);
            });
        }

        // ========== 初期化 ==========
        updateOverlay();

        // マップ移動/ズーム時にCSS回転を再適用
        map.on('zoomanim moveend', function() {
            if (contourOverlay) {
                const rotation = parseInt(document.getElementById('rotationSlider').value);
                const fallDirection = rotation + 180;
                const cssRotation = fallDirection - 90;
                const imgElement = contourOverlay.getElement();
                if (imgElement) {
                    imgElement.style.transformOrigin = 'center center';
                    imgElement.style.transform = `rotate(${cssRotation}deg)`;
                }
            }
        });
    </script>
</body>
</html>
