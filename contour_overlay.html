<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERA鹿島 コンター図オーバーレイ (RCCM / BOS)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }
        #map { width: 100%; height: 100vh; }

        .leaflet-image-canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 16px;
            z-index: 1000;
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-panel h2 {
            font-size: 15px;
            color: #e94560;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #94d2bd;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-row input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }
        .control-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffa502;
            min-width: 55px;
            text-align: right;
        }
        .toggle-btn {
            width: 100%;
            padding: 10px;
            border: 2px solid #e94560;
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .toggle-btn.active {
            background: #e94560;
            color: #fff;
        }
        .back-link {
            display: block;
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-link:hover { transform: translateY(-2px); }

        .color-legend {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        .color-legend h4 {
            font-size: 12px;
            color: #ffa502;
            margin-bottom: 8px;
        }
        .color-bar {
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(to right,
                #0000ff, #0040ff, #0080ff, #00bfff, #00ffff,
                #00ff80, #00ff00, #80ff00, #ffff00,
                #ffbf00, #ff8000, #ff4000, #ff0000);
            margin-bottom: 4px;
        }
        .color-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
        }
        .note {
            font-size: 10px;
            color: #888;
            margin-top: 8px;
            line-height: 1.5;
        }
        .size-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="control-panel">
        <h2>コンター図オーバーレイ</h2>
        <p style="font-size:11px; color:#aaa; margin-bottom:12px;">Resultant Acceleration 分布をマップに重畳表示</p>

        <div class="control-group">
            <label>解析ソース</label>
            <div style="display:flex; gap:6px;">
                <button class="toggle-btn active" id="srcRccmBtn" style="flex:1;" onclick="setSource('rccm')">RCCM</button>
                <button class="toggle-btn" id="srcBosBtn" style="flex:1;" onclick="setSource('bos')">BOS</button>
            </div>
        </div>

        <div class="control-group">
            <button class="toggle-btn active" id="contourToggle" onclick="toggleContour()">
                コンター図: 表示中
            </button>
        </div>

        <div class="control-group">
            <label>透過度</label>
            <div class="control-row">
                <input type="range" id="opacitySlider" min="0" max="100" value="60" oninput="updateParams()">
                <div class="control-value" id="opacityValue">60%</div>
            </div>
        </div>

        <div class="control-group">
            <label>煙突後方角度（度）</label>
            <div class="control-row">
                <input type="range" id="rotationSlider" min="0" max="360" value="153" oninput="updateParams()">
                <div class="control-value" id="rotationValue">153°</div>
            </div>
        </div>

        <div class="control-group">
            <label>スケール微調整</label>
            <div class="control-row">
                <input type="range" id="scaleSlider" min="50" max="200" value="100" oninput="updateParams()">
                <div class="control-value" id="scaleValue">100%</div>
            </div>
        </div>

        <div class="size-grid">
            <div class="control-group">
                <label>転倒方向オフセット</label>
                <div class="control-row">
                    <input type="range" id="offsetXSlider" min="-200" max="200" value="0" oninput="updateParams()">
                    <div class="control-value" id="offsetXValue">0m</div>
                </div>
            </div>
            <div class="control-group">
                <label>横方向オフセット</label>
                <div class="control-row">
                    <input type="range" id="offsetYSlider" min="-200" max="200" value="0" oninput="updateParams()">
                    <div class="control-value" id="offsetYValue">0m</div>
                </div>
            </div>
        </div>

        <div class="color-legend">
            <h4 id="legendTitle">Resultant Acceleration [m/s²]</h4>
            <div class="color-bar"></div>
            <div class="color-labels" id="legendLabels">
                <span>0</span>
                <span>2e+3</span>
                <span>4e+3</span>
                <span>6e+3</span>
                <span>8e+3</span>
                <span>1e+4</span>
            </div>
        </div>

        <div class="note">
            ※ スライダーでコンター図の位置・サイズ・角度を微調整できます<br>
            ※ 煙突長さ230mを基準にスケーリング<br>
            ※ 煙突基部を回転の軸としています
        </div>

        <a href="index.html" class="back-link">&larr; 振動解析比較マップに戻る</a>
    </div>

    <script>
        // ========== 定数 ==========
        const centerLat = 35.917924;
        const centerLng = 140.698911;

        // 解析ソース毎のコンター設定
        // - IMAGE_M_PER_PX: 画像1px が現実の何mに相当するか
        // - ANCHOR_RATIO_X/Y: 煙突基部の画像内正規化位置 (0-1)
        // - LEGEND_MAX: 凡例の最大値 (右端ラベル)
        const SOURCES = {
            rccm: {
                file: 'contour_rev002.png',
                IMAGE_M_PER_PX: 0.988,
                ANCHOR_RATIO_X: 0.242,
                ANCHOR_RATIO_Y: 0.759,
                legendTitle: 'Resultant Acceleration [m/s²]',
                legendLabels: ['0','2e+3','4e+3','6e+3','8e+3','1e+4']
            },
            bos: {
                // BOS: Chimney Analysis (700m×500m プロット、煙突基部=左から400m/上から400m)
                // 単位は [mm/s²] (BOS回答スライドより)。転倒右側は計算領域省略（対称仮定）
                file: 'contour_bos.png',
                IMAGE_M_PER_PX: 0.6910,
                ANCHOR_RATIO_X: 0.5716,
                ANCHOR_RATIO_Y: 0.8002,
                legendTitle: 'Resultant Acceleration [mm/s²]',
                legendLabels: ['0','2e+2','4e+2','6e+2','8e+2','1e+3']
            }
        };

        let currentSource = 'rccm';
        let cfg = SOURCES[currentSource];

        // ========== マップ初期化 ==========
        const map = L.map('map', {
            center: [centerLat, centerLng],
            zoom: 16,
            zoomControl: true
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        });
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        });
        satelliteLayer.addTo(map);
        L.control.layers({ "航空写真": satelliteLayer, "地図": osmLayer }).addTo(map);

        // ========== 座標計算 ==========
        function offsetLatLng(lat, lng, distanceMeters, bearingDegrees) {
            const R = 6371000;
            const bearing = bearingDegrees * Math.PI / 180;
            const lat1 = lat * Math.PI / 180;
            const lng1 = lng * Math.PI / 180;
            const lat2 = Math.asin(
                Math.sin(lat1) * Math.cos(distanceMeters / R) +
                Math.cos(lat1) * Math.sin(distanceMeters / R) * Math.cos(bearing)
            );
            const lng2 = lng1 + Math.atan2(
                Math.sin(bearing) * Math.sin(distanceMeters / R) * Math.cos(lat1),
                Math.cos(distanceMeters / R) - Math.sin(lat1) * Math.sin(lat2)
            );
            return [lat2 * 180 / Math.PI, lng2 * 180 / Math.PI];
        }

        // ========== 煙突マーカー ==========
        const centerIcon = L.divIcon({
            className: '',
            html: '<div style="background:#e94560;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 15px rgba(233,69,96,0.8);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        L.marker([centerLat, centerLng], { icon: centerIcon, zIndexOffset: 1000 })
            .addTo(map).bindPopup('<b>煙突位置（基部）</b>');

        // ========== Canvas コンターオーバーレイ ==========
        const contourImage = new Image();
        contourImage.src = cfg.file;

        let contourVisible = true;
        let canvas, ctx;

        // カスタムCanvasレイヤー
        const ContourCanvasLayer = L.Layer.extend({
            onAdd: function(map) {
                this._map = map;
                canvas = document.createElement('canvas');
                canvas.className = 'leaflet-image-canvas';
                canvas.style.pointerEvents = 'none';
                map.getPane('overlayPane').appendChild(canvas);
                ctx = canvas.getContext('2d');

                map.on('zoom viewreset resize moveend zoomend', this._redraw, this);
                contourImage.onload = () => this._redraw();
                if (contourImage.complete) this._redraw();
            },

            onRemove: function(map) {
                map.off('zoom viewreset resize moveend zoomend', this._redraw, this);
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            },

            _redraw: function() {
                if (!this._map || !contourImage.complete) return;

                const mapSize = this._map.getSize();
                canvas.width = mapSize.x;
                canvas.height = mapSize.y;

                // Leafletのpane位置に合わせてcanvasを配置
                const topLeftPoint = this._map.containerPointToLayerPoint([0, 0]);
                L.DomUtil.setPosition(canvas, topLeftPoint);

                ctx.clearRect(0, 0, mapSize.x, mapSize.y);

                if (!contourVisible) return;

                // パラメータ取得
                const opacity = parseInt(document.getElementById('opacitySlider').value) / 100;
                const backwardAngle = parseInt(document.getElementById('rotationSlider').value);
                const scale = parseInt(document.getElementById('scaleSlider').value) / 100;
                const offsetX = parseInt(document.getElementById('offsetXSlider').value);
                const offsetY = parseInt(document.getElementById('offsetYSlider').value);
                const fallDirection = backwardAngle + 180;

                // 煙突基部のアンカー位置（オフセット適用）
                let anchorLatLng = [centerLat, centerLng];
                if (offsetX !== 0) {
                    anchorLatLng = offsetLatLng(anchorLatLng[0], anchorLatLng[1], offsetX, fallDirection);
                }
                if (offsetY !== 0) {
                    anchorLatLng = offsetLatLng(anchorLatLng[0], anchorLatLng[1], offsetY, fallDirection + 90);
                }

                // 煙突基部のコンテナピクセル座標
                const anchorPx = this._map.latLngToContainerPoint(anchorLatLng);

                // 現在のズームでの1メートルあたりのピクセル数を計算
                // (Leaflet 1.9.4 が latLngToContainerPoint で整数丸めするため
                //  1m差では deltaX=0 になる罠あり。1000m差で計測して 1/1000 する)
                const lat = anchorLatLng[0];
                const lng = anchorLatLng[1];
                const p1 = this._map.latLngToContainerPoint([lat, lng]);
                const kmLng = 1000 / (111320 * Math.cos(lat * Math.PI / 180));
                const p2 = this._map.latLngToContainerPoint([lat, lng + kmLng]);
                const pixelsPerMeter = Math.abs(p2.x - p1.x) / 1000;

                // 画像の描画スケール
                // IMAGE_M_PER_PX → 1px in image = X m in real
                // We need: drawScale = pixelsPerMeter * IMAGE_M_PER_PX * userScale
                const drawScale = pixelsPerMeter * cfg.IMAGE_M_PER_PX * scale;

                const imgW = contourImage.width * drawScale;
                const imgH = contourImage.height * drawScale;

                // 回転角度: 画像の「右」方向を転倒方向に合わせる
                // 画像内で煙突は右向き → 地図上のfallDirection に合わせる
                // 地図は北が上(0°) → CSS/Canvasの角度はx軸から時計回り
                // Canvas: 0° = 右(東), 地図: 0° = 上(北)
                // 地図のfallDirection°を Canvasの角度に変換: canvasAngle = fallDirection - 90
                const canvasAngle = (fallDirection - 90) * Math.PI / 180;

                // 描画
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.translate(anchorPx.x, anchorPx.y);
                ctx.rotate(canvasAngle);
                // アンカー位置（煙突基部）が画像内のANCHOR_RATIO位置に来るように描画
                ctx.drawImage(contourImage,
                    -cfg.ANCHOR_RATIO_X * imgW,
                    -cfg.ANCHOR_RATIO_Y * imgH,
                    imgW, imgH);
                ctx.restore();
            },

            redraw: function() {
                this._redraw();
            }
        });

        const contourLayer = new ContourCanvasLayer();
        contourLayer.addTo(map);

        // ========== 煙突転倒線・同心円 ==========
        const chimneyLayer = L.layerGroup().addTo(map);

        function updateChimneyLine() {
            chimneyLayer.clearLayers();
            const backwardAngle = parseInt(document.getElementById('rotationSlider').value);
            const fallDirection = backwardAngle + 180;
            const tipPos = offsetLatLng(centerLat, centerLng, 230, fallDirection);

            L.polyline([[centerLat, centerLng], tipPos], {
                color: '#ff9500',
                weight: 8,
                opacity: 0.8,
                lineCap: 'round'
            }).addTo(chimneyLayer);

            const labelPos = offsetLatLng(centerLat, centerLng, 115, fallDirection);
            L.marker(labelPos, {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="background:rgba(255,149,0,0.9);border:2px solid #cc7000;border-radius:6px;padding:4px 10px;color:#000;font-size:11px;font-weight:bold;white-space:nowrap;">煙突転倒方向(230m)</div>',
                    iconSize: [130, 24],
                    iconAnchor: [65, 12]
                })
            }).addTo(chimneyLayer);

            // 同心円
            const distances = [50, 100, 200, 300, 400];
            const colors = ['#ff6b6b88', '#ffa50288', '#94d2bd88', '#4a90e288', '#9b59b688'];
            distances.forEach((dist, i) => {
                const pts = [];
                for (let a = 0; a <= 360; a += 3) {
                    pts.push(offsetLatLng(centerLat, centerLng, dist, a));
                }
                L.polyline(pts, { color: colors[i], weight: 2, opacity: 0.5, dashArray: '8, 6' }).addTo(chimneyLayer);

                const lp = offsetLatLng(centerLat, centerLng, dist, backwardAngle - 45);
                L.marker(lp, {
                    icon: L.divIcon({
                        className: '',
                        html: `<div style="background:rgba(0,0,0,0.7);border-radius:3px;padding:1px 4px;color:#fff;font-size:10px;font-weight:bold;text-align:center;">${dist}m</div>`,
                        iconSize: [36, 14],
                        iconAnchor: [18, 7]
                    })
                }).addTo(chimneyLayer);
            });
        }

        // ========== コントロール ==========
        function updateParams() {
            document.getElementById('opacityValue').textContent = document.getElementById('opacitySlider').value + '%';
            document.getElementById('rotationValue').textContent = document.getElementById('rotationSlider').value + '\u00B0';
            document.getElementById('scaleValue').textContent = document.getElementById('scaleSlider').value + '%';
            document.getElementById('offsetXValue').textContent = document.getElementById('offsetXSlider').value + 'm';
            document.getElementById('offsetYValue').textContent = document.getElementById('offsetYSlider').value + 'm';

            contourLayer.redraw();
            updateChimneyLine();
        }

        function toggleContour() {
            contourVisible = !contourVisible;
            const btn = document.getElementById('contourToggle');
            btn.classList.toggle('active', contourVisible);
            btn.textContent = contourVisible ? 'コンター図: 表示中' : 'コンター図: 非表示';
            contourLayer.redraw();
        }

        function updateLegend() {
            document.getElementById('legendTitle').textContent = cfg.legendTitle;
            const labels = document.getElementById('legendLabels');
            labels.innerHTML = cfg.legendLabels.map(l => `<span>${l}</span>`).join('');
        }

        function setSource(src) {
            console.log('[setSource] requested=', src, 'current=', currentSource);
            if (!(src in SOURCES)) return;
            currentSource = src;
            cfg = SOURCES[src];
            document.getElementById('srcRccmBtn').classList.toggle('active', src === 'rccm');
            document.getElementById('srcBosBtn').classList.toggle('active', src === 'bos');
            updateLegend();
            // コンター表示が消されていたら自動的にONに戻す
            if (!contourVisible) {
                contourVisible = true;
                const btn = document.getElementById('contourToggle');
                btn.classList.add('active');
                btn.textContent = 'コンター図: 表示中';
            }
            // 画像差し替え：onload で redraw
            contourImage.onload = () => {
                console.log('[setSource] image loaded', cfg.file, contourImage.naturalWidth, 'x', contourImage.naturalHeight);
                contourLayer.redraw();
            };
            contourImage.onerror = (e) => console.error('[setSource] image load FAILED', cfg.file, e);
            contourImage.src = cfg.file + '?v=' + Date.now();
        }

        // ========== 初期化 ==========
        updateLegend();
        updateChimneyLine();
    </script>
</body>
</html>
